<!-- 访客计数器 -->
<div id="visitor-counter" style="
  text-align: center;
  padding: 14px 0;
  font-size: 1.1rem;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  margin: 0;
  letter-spacing: 0.5px;
">
  <span id="counter-text">🚀 正在加载访问数据...</span>
</div>

<script>
(function() {
  // TODO: 部署 Worker 后将此处替换为实际 Worker URL
  var COUNTER_API = 'https://junge-visitor-counter.你的-subdomain.workers.dev';

  function updateCounter() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', COUNTER_API, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          document.getElementById('counter-text').textContent =
            '🚀 已陪伴 ' + data.formatted + ' 位访客走过旅途';
        } catch(e) {
          document.getElementById('counter-text').textContent = '🚀 记录每一次相遇';
        }
      } else if (xhr.readyState === 4 && xhr.status !== 200) {
        document.getElementById('counter-text').textContent = '🚀 记录每一次相遇';
      }
    };
    xhr.send();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateCounter);
  } else {
    updateCounter();
  }
})();
</script>
